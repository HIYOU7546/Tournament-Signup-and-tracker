<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Brackets</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bracket.css">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<style>
  #frame{height:78vh}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tools a{text-decoration:none}
</style>
</head><body>
<main class="wide">
  <h1>Tournament Brackets</h1>
  <div class="card" id="tBanner" hidden><strong>Tournament in progress.</strong> Open play sign-ups are paused.</div>
  <div class="tools">
    <a href="https://brackethq.com" target="_blank" rel="noopener"><button class="gray">Bracket HQ (create / manage)</button></a>
  </div>
  <p class="muted" id="note">Loading...</p>
  <div class="tools" id="tabs"></div>

  <div id="linkView" hidden>
    <div class="tools">
      <button id="refresh">Refresh bracket</button>
      <a id="openFull" href="#" target="_blank" rel="noopener"><button class="gray">Open full page</button></a>
    </div>
    <div class="card">
      <h2 id="title"></h2>
      <iframe id="frame" title="Tournament bracket" loading="lazy"></iframe>
      <p class="muted">If the bracket doesn't appear, use "Open full page" above.</p>
    </div>
  </div>

  <div id="customView" hidden>
    <div class="card">
      <h2 id="ctitle"></h2>
      <p class="muted" id="csub"></p>
      <div id="cbody"></div>
    </div>
  </div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script src="bracket.js"></script><script src="bracketView.js"></script>
<script>
nav("brackets.html");
db("settings/tournamentMode").then(v => { if (v === true) $("#tBanner").hidden = false; }).catch(() => {});

let items = [], current = null, lastCustom = "";

// Bracket HQ links + built-in tournaments, in the order they were added.
async function loadItems() {
  const [b, t] = await Promise.all([db("brackets"), getTournaments()]);
  items = [
    ...(b ? Object.entries(b).map(([id, v]) => ({ key: "b-" + id, raw: id, kind: "link", name: v.name, url: v.url, order: v.order || 0 })) : []),
    ...t.map(x => ({ key: "t-" + x.id, raw: x.id, kind: "custom", name: x.name, t: x, order: x.order }))
  ].sort((a, b) => a.order - b.order);
}

// https://brackethq.com/b/abc12 (or .../embed) -> https://brackethq.com/b/abc12/embed/
function toEmbed(url) {
  const m = url.match(/brackethq\.com\/b\/([A-Za-z0-9_-]+)/i);
  return m ? `https://brackethq.com/b/${m[1]}/embed/` : url;
}

function renderTabs() {
  const tabs = $("#tabs"); tabs.replaceChildren();
  items.forEach(b => {
    const btn = document.createElement("button");
    btn.textContent = b.name;
    btn.className = b.key === current.key ? "" : "gray";
    btn.onclick = () => show(b.key);
    tabs.appendChild(btn);
  });
}

function drawCustom() {
  const t = current.t;
  $("#ctitle").textContent = t.name;
  $("#csub").textContent = (TYPE_LABELS[t.type] || t.type) + " · " + t.participants.length + " players";
  renderBracket($("#cbody"), t);
  lastCustom = JSON.stringify(t);
}

function show(key) {
  current = items.find(b => b.key === key || b.raw === key) || items[0];
  history.replaceState(null, "", "#" + current.key);
  renderTabs();
  $("#linkView").hidden = current.kind !== "link";
  $("#customView").hidden = current.kind !== "custom";
  if (current.kind === "link") {
    const embed = toEmbed(current.url);
    $("#title").textContent = current.name;
    $("#frame").src = embed;
    $("#openFull").href = embed.replace(/embed\/$/, "");
    $("#refresh").onclick = () => { $("#frame").src = embed; };
  } else drawCustom();
}

(async () => {
  try {
    await loadItems();
    if (!items.length) { $("#note").textContent = "No brackets have been added yet."; return; }
    $("#note").textContent = "";
    show(decodeURIComponent(location.hash.slice(1)));
  } catch (e) { $("#note").textContent = e.message; }
})();

// Built-in brackets refresh by themselves so scores show up live.
setInterval(async () => {
  if (!current || current.kind !== "custom") return;
  try {
    await loadItems();
    const fresh = items.find(x => x.key === current.key);
    if (!fresh) { show(items[0] ? items[0].key : ""); return; }
    current = fresh;
    if (JSON.stringify(fresh.t) !== lastCustom) drawCustom();
  } catch {}
}, 10000);
</script></body></html>
